name: undocx-app

services:
  postgres:
    image: postgres:18-alpine
    container_name: undocx-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-undocx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-undocx}
      POSTGRES_DB: ${POSTGRES_DB:-undocx}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:

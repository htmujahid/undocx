name: undocx-app

services:
  postgres:
    image: postgres:18-alpine
    container_name: undocx-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-undocx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-undocx}
      POSTGRES_DB: ${POSTGRES_DB:-undocx}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: undocx-app-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-undocx}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-undocx-secret}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: undocx-app-minio-init
    restart: on-failure
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY_ID:-undocx}:${S3_SECRET_ACCESS_KEY:-undocx-secret}@minio:9000
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:-undocx}"]

volumes:
  postgres-data:
  minio-data:
